<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" fill="none">
  <!-- Architectural Luxury Monogram Crest -->
  <g transform="translate(10, 15)">
    <rect x="0" y="0" width="80" height="80" rx="2" stroke="#BF9944" stroke-width="1.5" fill="rgba(191,153,68,0.06)" />
    <rect x="6" y="6" width="68" height="68" rx="1" stroke="#BF9944" stroke-width="0.75" stroke-dasharray="2 2" fill="none" opacity="0.6" />
    
    <!-- Stylized Classical Column / Monogram Structure -->
    <path d="M22 62V24H32L40 44L48 24H58V62H50V36L42 56H38L30 36V62H22Z" fill="#BF9944" />
    <path d="M16 18H64M20 21H60M16 66H64" stroke="#BF9944" stroke-width="1.2" stroke-linecap="round" />
    <!-- Diamond Accent -->
    <polygon points="40,11 43,15 40,19 37,15" fill="#BF9944" />
  </g>

  <!-- Typography -->
