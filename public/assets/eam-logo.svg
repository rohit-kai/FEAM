    <text x="0" y="38" font-family="'Playfair Display', Georgia, serif" font-size="36" font-weight="600" letter-spacing="0.18em" fill="#FFFFFF">EAM</text>
    <text x="115" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" letter-spacing="0.28em" fill="#BF9944">ESTATE</text>
    
    <!-- Separator Line -->
    <line x1="0" y1="48" x2="290" y2="48" stroke="#BF9944" stroke-width="1" opacity="0.4" />
    
    <!-- Subtitle / Discipline -->
    <text x="0" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="0.22em" fill="#F9F8F6" opacity="0.85">HOSPITALITY INVESTMENT</text>
    <text x="0" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="500" letter-spacing="0.2em" fill="#BF9944" opacity="0.9">BANGKOK · EST. 2004</text>
  </g>
</svg>
